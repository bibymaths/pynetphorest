# Which branch to run: netphorest / crosstalk / both
mode: both

# Where to store ALL outputs (relative to repo root)
results_dir: results

# CLI entry point for the Typer app (usually 'pynetphorest' if installed)
pynetphorest_bin: "pynetphorest"

# Shared inputs
fasta: data/proteins.fasta              # your input FASTA file
atlas: src/pynetphorest/netphorest.db   # atlas path

# NetPhorest settings
netphorest_out_basename: netphorest
netphorest_causal: true                 # also run --causal variant
netphorest_min_posterior: 0.0           # CLI: --min-posterior (filter sites)
netphorest_sigmoid_clamp: 50.0          # CLI: --sigmoid-clamp (numeric stability)

# Crosstalk settings
ptm_within: data/ptmcode2/within.gz
ptm_between: data/ptmcode2/between.gz

crosstalk_model_name: crosstalk_model.pkl
crosstalk_predictions_name: crosstalk_predictions.tsv
crosstalk_threshold: 0.30
crosstalk_eval_dir: eval

# New knobs that map to crosstalk.py constants
crosstalk_window_size: 9        # CLI: --window-size (context window around STY)
crosstalk_negative_ratio: 3     # CLI: --neg-ratio (negatives per positive)
crosstalk_jobs: -1              # CLI: --jobs/--n-jobs, -1 = all cores